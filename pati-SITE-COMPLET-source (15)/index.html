<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0F6E56" />
    <meta name="description" content="PATI — Bâtir la Génération 2040. Histoires illustrées, audio et animées pour enfants guinéens." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/images/pati-logo-main.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>PATI — Bâtir la Génération 2040</title>
    <script>
      // Désinstalle tout ancien service worker et vide ses caches
      // (l'ancienne version PWA pouvait servir un contenu périmé).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
