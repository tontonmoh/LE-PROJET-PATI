<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projet Pati — Bâtir la Génération 2040</title>
    <meta name="description" content="Projet Pati : des contes, des livres et des jeux pour les enfants de Guinée et de la diaspora." />
    <link rel="icon" href="/images/pati-logo-white.png" />
    <meta name="theme-color" content="#0D2B1A" />
    <!-- Open Graph / partage social (aperçu générique) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Projet PATI" />
    <meta property="og:title" content="Projet Pati — des histoires pour la Génération 2040" />
    <meta property="og:description" content="Contes, livres et jeux pour les enfants de Guinée et de la diaspora — en français et dans nos langues." />
    <meta property="og:image" content="https://projetpati.com/images/pati-conteuse.webp" />
    <meta property="og:url" content="https://projetpati.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PATI" />
    <!-- Webfont d'affichage Univers Taadidi (Fraunces) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Formulaire fantôme Netlify : détecté au build pour activer Netlify Forms. Invisible. -->
    <form name="club-pati" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="ecole" />
      <input type="text" name="ville" />
      <input type="text" name="responsable" />
      <input type="email" name="email" />
      <input type="text" name="telephone" />
      <textarea name="message"></textarea>
    </form>
    <form name="creation-club" netlify netlify-honeypot="bot-field" hidden>
      <select name="type"><option></option></select>
      <input type="text" name="club" />
      <input type="text" name="ville" />
      <input type="text" name="responsable" />
      <input type="text" name="contact" />
      <textarea name="description"></textarea>
    </form>
    <form name="activite-quartier" netlify netlify-honeypot="bot-field" hidden>
      <select name="type"><option></option></select>
      <input type="text" name="club" />
      <input type="text" name="quartier" />
      <input type="text" name="responsable" />
      <input type="text" name="contact" />
      <textarea name="description"></textarea>
    </form>
    <form name="reservation-atelier" netlify netlify-honeypot="bot-field" hidden>
      <select name="atelier"><option></option></select>
      <select name="pack"><option></option></select>
      <input type="text" name="structure" />
      <input type="text" name="ville" />
      <input type="text" name="responsable" />
      <input type="text" name="contact" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
