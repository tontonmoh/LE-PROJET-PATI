<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chante LIBERTÉ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#CE1126; --yellow:#FCD116; --green:#009460;
    --pati:#0F6E56; --dark:#0D2B1A; --cream:#FFF6E7; --muted:#5a6b62; --coral:#E8532D; --sky:#4FB3E8;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:var(--cream); color:var(--dark); font-family:'Nunito','Trebuchet MS',system-ui,sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none;}
  h1,h2,h3,.fred{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;}
  button{font-family:inherit; cursor:pointer; border:0;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column; overflow:auto;}
  .screen.on{display:flex;}
  .flagbar{height:10px; flex-shrink:0; background:linear-gradient(90deg,var(--red) 0 33.33%,var(--yellow) 33.33% 66.66%,var(--green) 66.66%);}

  /* Accueil */
  #home{align-items:center;}
  .home-in{width:100%; max-width:680px; padding:20px 16px 30px; display:flex; flex-direction:column; align-items:center; gap:12px;}
  #home h1{font-size:clamp(30px,9vw,50px); color:var(--dark); text-align:center; line-height:1;}
  #home h1 b{color:var(--red);}
  #home .sub{font-weight:800; color:var(--muted); text-align:center; font-size:clamp(15px,4vw,18px); max-width:520px;}
  .badge{display:none; align-items:center; gap:10px; background:#fff; border:3px solid var(--yellow); border-radius:999px; padding:8px 18px; font-weight:800; color:var(--dark);}
  .badge.on{display:flex;}
  .steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; width:100%; margin-top:6px;}
  .step{background:#fff; border-radius:22px; padding:14px; display:flex; align-items:center; gap:12px; text-align:left; box-shadow:0 5px 0 rgba(0,0,0,.08); border:3px solid transparent; transition:transform .1s;}
  .step:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.08);}
  .step .num{width:44px; height:44px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:20px; flex-shrink:0;}
  .step .tt{font-family:'Fredoka',sans-serif; font-weight:600; font-size:18px; display:block;}
  .step .ds{font-size:13px; font-weight:800; color:var(--muted);}
  .step.done{border-color:var(--green);}
  .step.done .num:after{content:"✓";}
  .step.done .num span{display:none;}
  .pill{background:#0d2b1a10; color:var(--dark); font-weight:800; border-radius:999px; padding:8px 16px; font-size:14px;}

  /* En-tête des activités */
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:var(--dark); color:#fff; flex-shrink:0;}
  .top .ttl{font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(16px,4.5vw,21px);}
  .top .pill{background:rgba(255,255,255,.15); color:#fff;}
  .top .cnt{font-weight:800; font-size:14px; opacity:.85; min-width:40px; text-align:right;}
  .stage{flex:1; width:100%; max-width:720px; margin:0 auto; padding:16px 14px 24px; display:flex; flex-direction:column; gap:14px;}
  .card{background:#fff; border-radius:22px; padding:18px; box-shadow:0 4px 0 rgba(0,0,0,.06);}
  .q{font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(18px,5vw,23px); text-align:center; color:var(--dark);}
  .hint{font-weight:800; color:var(--coral); min-height:24px; text-align:center; font-size:clamp(15px,4vw,18px);}
  .actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .go{background:var(--pati); color:#fff; font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(18px,5vw,22px); border-radius:999px; padding:13px 28px; box-shadow:0 6px 0 #0a4a3a;}
  .go:active{transform:translateY(4px); box-shadow:0 2px 0 #0a4a3a;}
  .go.alt{background:#fff; color:var(--pati); box-shadow:0 6px 0 #0F6E5640;}
  .go[disabled]{opacity:.4; pointer-events:none;}

  /* Histoire */
  .story{display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding:26px 18px;}
  .story .pic{font-size:clamp(64px,20vw,96px); line-height:1;}
  .story .yr{font-family:'Fredoka',sans-serif; font-weight:700; color:var(--red); font-size:26px;}
  .story p{font-weight:800; font-size:clamp(17px,4.6vw,21px); line-height:1.45; color:var(--dark); max-width:520px;}
  .dots{display:flex; gap:6px; justify-content:center;}
  .dots i{width:10px; height:10px; border-radius:50%; background:#0d2b1a22; display:block;}
  .dots i.on{background:var(--red);}

  /* Paroles */
  .lyrics{display:flex; flex-direction:column; gap:4px;}
  .vline{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; transition:background .2s;}
  .vline.playing{background:#FCD11633;}
  .vline .txt{flex:1; font-weight:800; font-size:clamp(17px,4.6vw,21px); line-height:1.35;}
  .vline.refrain .txt{color:var(--red);}
  .vline .play{width:40px; height:40px; border-radius:50%; background:var(--sky); color:#fff; font-size:18px; flex-shrink:0;}
  .w{border-radius:6px; transition:background .1s;}
  .w.lit{background:var(--yellow);}
  .hard{border-bottom:3px dotted var(--coral); cursor:pointer;}
  .gap-line{height:10px;}
  .dico{position:sticky; bottom:0; background:var(--dark); color:#fff; border-radius:18px; padding:14px 16px; font-weight:800; font-size:16px; line-height:1.4; display:none;}
  .dico.on{display:block; animation:up .25s;}
  .dico b{color:var(--yellow); font-family:'Fredoka',sans-serif; font-size:19px;}
  .note-audio{font-size:13px; font-weight:800; color:var(--muted); text-align:center;}

  /* Trous & chasse */
  .bigline{font-weight:800; font-size:clamp(20px,5.6vw,27px); line-height:1.5; text-align:center;}
  .blank{display:inline-block; min-width:110px; border-bottom:4px solid var(--red); color:var(--red);}
  .choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .choice{background:var(--dark); color:#fff; font-weight:800; font-size:clamp(17px,4.6vw,20px); border-radius:18px; padding:16px 10px; box-shadow:0 5px 0 rgba(0,0,0,.2);}
  .choice:active{transform:translateY(3px);}
  .choice.good{background:var(--green);}
  .choice.bad, .wbtn.bad{animation:wob .4s;}
  .wbtn{background:transparent; font-weight:800; font-size:inherit; color:var(--dark); padding:2px 4px; border-radius:8px; border-bottom:3px solid #0d2b1a18; margin:2px;}
  .wbtn.good{background:var(--yellow);}
  .wbtn.shown{background:#d9f5e6; color:var(--green);}

  /* Ordre */
  .answer{display:flex; flex-direction:column; gap:6px; min-height:60px;}
  .answer .placed{background:#d9f5e6; color:var(--green); border-radius:12px; padding:8px 12px; font-weight:800; font-size:clamp(15px,4.2vw,18px); animation:up .25s;}
  .pool{display:flex; flex-direction:column; gap:8px;}
  .piece{background:#fff; border:3px solid #0d2b1a18; border-radius:14px; padding:12px; font-weight:800; font-size:clamp(15px,4.2vw,18px); text-align:left; color:var(--dark); box-shadow:0 3px 0 rgba(0,0,0,.06);}
  .piece:active{transform:translateY(2px);}
  .piece.bad{animation:wob .4s; border-color:var(--coral);}

  /* Chanter seul */
  .kara .vline .txt{font-size:clamp(17px,4.8vw,22px);}
  .hid{display:inline-block; min-width:2.2em; border-bottom:3px dashed var(--red); color:transparent; cursor:pointer; border-radius:4px;}
  .hid.rev{color:var(--red); border-bottom-color:transparent;}
  .passes{display:flex; gap:6px; justify-content:center;}
  .passes i{width:34px; height:8px; border-radius:4px; background:#0d2b1a1a; display:block;}
  .passes i.on{background:var(--green);}

  /* Fin */
  #win{align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px;}
  #win .medal{font-size:90px; line-height:1; animation:bob 1s ease-in-out infinite alternate;}
  #win h2{font-size:clamp(32px,9vw,52px); color:var(--dark);}
  #win .msg{font-weight:800; color:var(--muted); font-size:clamp(16px,4.5vw,20px); max-width:480px;}
  .confetti{position:fixed; top:-20px; width:10px; height:16px; border-radius:2px; pointer-events:none; animation:fall linear forwards; z-index:50;}

  @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  @keyframes up{from{transform:translateY(10px); opacity:0}to{transform:none; opacity:1}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-12px)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="flagbar"></div>
  <div class="home-in">
    <div style="font-size:56px;line-height:1">🎤🇬🇳</div>
    <h1>Chante <b>LIBERTÉ</b></h1>
    <p class="sub">L'hymne national de la Guinée. Apprends les vrais mots, pas à pas.</p>
    <div class="badge" id="badge">🏅 Je connais l'hymne&nbsp;!</div>
    <div class="steps" id="steps"></div>
    <button class="pill" id="voiceBtn" style="margin-top:6px">🔊 Voix : oui</button>
  </div>
</section>

<section id="act" class="screen">
  <div class="flagbar"></div>
  <div class="top">
    <button class="pill" id="back">← Menu</button>
    <div class="ttl" id="actTitle"></div>
    <div class="cnt" id="actCnt"></div>
  </div>
  <div class="stage" id="stage"></div>
</section>

<section id="win" class="screen">
  <div class="medal" id="winMedal">🏅</div>
  <h2 id="winTitle">Bravo&nbsp;!</h2>
  <p class="msg" id="winMsg"></p>
  <div class="actions">
    <button class="go" id="winNext">Étape suivante →</button>
    <button class="go alt" id="winAgain">Recommencer</button>
    <button class="go alt" id="winMenu">Menu</button>
  </div>
</section>

<script>
/* ═══════════════════════════════════════════════════════════════════
   DONNÉES — à éditer ici, sans toucher au moteur plus bas.
   ═══════════════════════════════════════════════════════════════════ */

/* Texte fourni par Moh (17/10/2026). Le découpage en vers suit la phrase
   musicale supposée : à ajuster sur l'enregistrement officiel.
   r:true = refrain (affiché en rouge). "" = saut de strophe. */
var VERS = [
  { t:"Peuple d'Afrique," },
  { t:"le passé historique," },
  { t:"que chante l'hymne" },
  { t:"de la Guinée fière et jeune," },
  { t:"illustre l'épopée de nos frères" },
  { t:"morts au champ d'honneur" },
  { t:"en libérant l'Afrique." },
  { t:"Le peuple de Guinée" },
  { t:"prêchant l'unité" },
  { t:"appelle l'Afrique." },
  { t:"LIBERTÉ ! C'est la voix d'un peuple", r:true },
  { t:"qui appelle tous ses frères", r:true },
  { t:"de la Grande Afrique.", r:true },
  { t:"LIBERTÉ ! C'est la voix d'un peuple", r:true },
  { t:"qui appelle tous ses frères", r:true },
  { t:"à se retrouver.", r:true },
  { t:"Bâtissons l'unité africaine", r:true },
  { t:"dans l'indépendance recouvrée.", r:true }
];
var STROPHES = [[0,6],[7,12],[13,17]];   // découpage pour « Dans l'ordre »

/* Petit dico : mot (tel qu'écrit dans le texte, minuscules) → explication enfant */
var DICO = {
  "hymne": "Un chant qui représente un pays. On le chante debout, tous ensemble.",
  "historique": "Le passé historique, c'est ce qui s'est passé avant nous et qu'on raconte dans les livres d'histoire.",
  "fière": "Contente et digne de ce qu'elle est.",
  "illustre": "Ici, « illustrer » veut dire montrer, raconter comme un exemple.",
  "épopée": "Une grande histoire de héros, pleine de courage, qu'on se raconte de génération en génération.",
  "champ d'honneur": "« Mourir au champ d'honneur », c'est donner sa vie en se battant pour une grande cause.",
  "libérant": "Rendre libre. Ici : faire que l'Afrique ne soit plus dirigée par d'autres pays.",
  "prêchant": "En répétant à tout le monde, comme un conseil très important.",
  "unité": "Être unis, ensemble, comme une seule grande famille.",
  "liberté": "Pouvoir décider soi-même de sa vie. C'est aussi le nom de l'hymne !",
  "bâtissons": "Construisons, ensemble.",
  "africaine": "De l'Afrique.",
  "indépendance": "Quand un pays décide lui-même pour lui, sans être dirigé par un autre pays. La Guinée est indépendante depuis le 2 octobre 1958.",
  "recouvrée": "Retrouvée, reprise après l'avoir perdue."
};

/* Mots à trous : vers, mot juste, deux intrus */
var TROUS = [
  { v:0,  ok:"d'Afrique",  ko:["de Guinée","de Conakry"] },
  { v:1,  ok:"historique", ko:["héroïque","glorieux"] },
  { v:3,  ok:"fière",      ko:["forte","belle"] },
  { v:3,  ok:"jeune",      ko:["libre","grande"] },
  { v:4,  ok:"l'épopée",   ko:["l'histoire","la victoire"] },
  { v:5,  ok:"d'honneur",  ko:["de bataille","de combat"] },
  { v:6,  ok:"libérant",   ko:["défendant","sauvant"] },
  { v:8,  ok:"l'unité",    ko:["la liberté","la paix"] },
  { v:10, ok:"voix",       ko:["joie","force"] },
  { v:12, ok:"Grande",     ko:["belle","jeune"] },
  { v:15, ok:"retrouver",  ko:["rassembler","unir"] },
  { v:16, ok:"Bâtissons",  ko:["Chantons","Construisons"] },
  { v:17, ok:"recouvrée.", ko:["retrouvée.","gagnée."] }
];

/* Chasse à l'erreur : les déformations qu'on entend VRAIMENT (à remplir par Moh).
   Format : { v: n° du vers, faux: "mot entendu", vrai: "mot juste" }
   Tant que la liste est vide (ou courte), le jeu complète avec les intrus de TROUS. */
var ERREURS_COURANTES = [
];

var HISTOIRE = [
  { pic:"🏛️", yr:"1904", p:"À Conakry, le gouverneur de la colonie réunit les chefs venus de tout le pays." },
  { pic:"👑", yr:"", p:"Alpha Yaya Diallo, roi du Labé, arrive avec son cortège. Il est généreux avec tout le monde." },
  { pic:"🪘", yr:"", p:"Un griot, Korofo Moussa, est touché par cette générosité. Il invente un air en l'honneur d'Alpha Yaya." },
  { pic:"🗺️", yr:"", p:"Tous les griots présents apprennent l'air. En rentrant chez eux, ils le chantent partout : il fait le tour du pays." },
  { pic:"🇬🇳", yr:"1958", p:"La Guinée devient indépendante. Fodéba Keïta et Jean Cellier écrivent des paroles en français sur cet air. Le 2 octobre 1958, il devient l'hymne national : « Liberté »." },
  { pic:"🎤", yr:"Et toi ?", p:"Quand tu chantes l'hymne, tu chantes un air de griot vieux de plus de 120 ans. À toi d'apprendre les vrais mots !" }
];

var ETAPES = [
  { id:"histoire", titre:"L'histoire",        ds:"D'où vient l'hymne ?",       color:"#C8841E" },
  { id:"paroles",  titre:"Les paroles",       ds:"Écouter et comprendre",      color:"#4FB3E8" },
  { id:"trous",    titre:"Le mot manquant",   ds:"Trouve le bon mot",          color:"#009460" },
  { id:"ordre",    titre:"Dans l'ordre",      ds:"Remets les vers en place",   color:"#7A4FBF" },
  { id:"chasse",   titre:"La chasse à l'erreur", ds:"Repère le mot faux",      color:"#E8532D" },
  { id:"chanter",  titre:"Chanter seul",      ds:"Les mots s'effacent…",       color:"#CE1126" }
];

/* ═══════════════════ MOTEUR ═══════════════════ */
var $ = function(s){ return document.querySelector(s); };
var voiceOn = true, cur = null, errors = 0, t0 = 0;

function load(){ try{ return JSON.parse(localStorage.getItem("pati-hymne")||"{}"); }catch(e){ return {}; } }
function save(k){ try{ var o=load(); o[k]=1; localStorage.setItem("pati-hymne",JSON.stringify(o)); }catch(e){} }

function speak(txt, onWord, onEnd){
  if(!voiceOn || !window.speechSynthesis){ if(onEnd) setTimeout(onEnd, 300); return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang="fr-FR"; u.rate=0.85; u.pitch=1.05;
    var v = speechSynthesis.getVoices().filter(function(x){ return /^fr/i.test(x.lang); });
    if(v.length) u.voice=v[0];
    if(onWord) u.onboundary=function(e){ if(e.name==="word"||e.name===undefined) onWord(e.charIndex); };
    if(onEnd) u.onend=onEnd;
    speechSynthesis.speak(u);
  }catch(e){ if(onEnd) onEnd(); }
}
function stopVoice(){ try{ speechSynthesis.cancel(); }catch(e){} }

var AC=null;
function tone(f,d,type,w,vol){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var t=AC.currentTime+(w||0),o=AC.createOscillator(),g=AC.createGain(); o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(vol||.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);}catch(e){} }
function sGood(){ tone(660,.12); tone(880,.18,"triangle",.1); }
function sBad(){ tone(220,.22,"square",0,.07); }
function sWin(){ [523,659,784,1047,784,1047].forEach(function(f,i){ tone(f,.22,"triangle",i*.13,.18); }); }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function show(id){ document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("on"); }); $("#"+id).classList.add("on"); }
function wob(el){ el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); }

/* ── Accueil ── */
function home(){
  stopVoice();
  var d=load(), h="";
  ETAPES.forEach(function(e,i){
    h+='<button class="step'+(d[e.id]?" done":"")+'" data-i="'+i+'"><span class="num" style="background:'+e.color+'"><span>'+(i+1)+'</span></span>'+
       '<span><span class="tt">'+e.titre+'</span><span class="ds">'+e.ds+'</span></span></button>';
  });
  $("#steps").innerHTML=h;
  document.querySelectorAll(".step").forEach(function(b){ b.onclick=function(){ open(+b.dataset.i); }; });
  $("#badge").classList.toggle("on", ["trous","ordre","chasse","chanter"].every(function(k){ return d[k]; }));
  show("home");
}
function open(i){
  cur=i; errors=0; t0=Date.now();
  var e=ETAPES[i];
  $("#actTitle").textContent=e.titre; $("#actCnt").textContent="";
  show("act"); $("#stage").scrollTop=0;
  ({histoire:actHistoire, paroles:actParoles, trous:actTrous, ordre:actOrdre, chasse:actChasse, chanter:actChanter})[e.id]();
}
function finish(msg){
  stopVoice();
  var e=ETAPES[cur]; save(e.id);
  var secs=Math.round((Date.now()-t0)/1000);
  $("#winMsg").textContent=msg;
  var all = ["trous","ordre","chasse","chanter"].every(function(k){ return load()[k]; });
  $("#winMedal").textContent = all ? "🏅" : "⭐";
  $("#winTitle").textContent = all ? "Tu connais l'hymne !" : "Bravo !";
  $("#winNext").style.display = cur<ETAPES.length-1 ? "" : "none";
  show("win"); sWin(); confetti();
  speak(all ? "Bravo ! Tu connais l'hymne national." : "Bravo ! "+msg);
  try{ parent.postMessage({ type:"pati-progress", kind:"hymne", step:e.id, seconds:secs, errors:errors, complete:all }, "*"); }catch(x){}
}
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cols=["#CE1126","#FCD116","#009460"];
  for(var i=0;i<70;i++){ var c=document.createElement("i"); c.className="confetti"; c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%3];
    c.style.animationDuration=(1.8+Math.random()*1.8)+"s"; c.style.animationDelay=(Math.random()*.6)+"s"; document.body.appendChild(c);
    setTimeout(function(el){ return function(){ el.remove(); }; }(c),4200); }
}

/* ── 1. L'histoire ── */
function actHistoire(){
  var k=0;
  function draw(){
    var s=HISTOIRE[k];
    $("#actCnt").textContent=(k+1)+"/"+HISTOIRE.length;
    $("#stage").innerHTML='<div class="card story"><div class="pic">'+s.pic+'</div>'+(s.yr?'<div class="yr">'+s.yr+'</div>':'')+'<p>'+s.p+'</p>'+
      '<div class="dots">'+HISTOIRE.map(function(_,i){ return '<i class="'+(i===k?"on":"")+'"></i>'; }).join("")+'</div></div>'+
      '<div class="actions">'+(k>0?'<button class="go alt" id="prev">←</button>':'')+'<button class="go alt" id="say">🔊</button><button class="go" id="next">'+(k<HISTOIRE.length-1?"Suite →":"J'ai compris ✔")+'</button></div>';
    speak(s.p);
    $("#say").onclick=function(){ speak(s.p); };
    if($("#prev")) $("#prev").onclick=function(){ k--; draw(); };
    $("#next").onclick=function(){ if(k<HISTOIRE.length-1){ k++; draw(); } else finish("Tu connais l'histoire de l'hymne."); };
  }
  draw();
}

/* ── texte d'un vers avec mots du dico soulignés et mots numérotés ── */
function lineHTML(t, withDico){
  var out="", re=/[^\s]+/g, m, keys=Object.keys(DICO).sort(function(a,b){ return b.length-a.length; });
  // repère les expressions de plusieurs mots (ex. « champ d'honneur »)
  var marks=[];
  if(withDico) keys.forEach(function(k){
    var i=t.toLowerCase().indexOf(k); if(i<0) return;
    var j=i+k.length;
    if(marks.some(function(x){ return i<x[1] && j>x[0]; })) return;
    marks.push([i,j,k]);
  });
  var pos=0;
  while((m=re.exec(t))){
    out+=esc(t.slice(pos,m.index));
    var w=m[0], a=m.index, b=a+w.length;
    var mk = marks.filter(function(x){ return a<x[1] && b>x[0]; })[0];
    var cls="w"+(mk?" hard":"");
    out+='<span class="'+cls+'" data-c="'+a+'"'+(mk?' data-k="'+esc(mk[2])+'"':'')+'>'+esc(w)+'</span>';
    pos=b;
  }
  return out+esc(t.slice(pos));
}

/* ── 2. Les paroles ── */
function actParoles(){
  var h='<div class="card"><div class="lyrics">';
  VERS.forEach(function(v,i){
    if(i===10) h+='<div class="gap-line"></div>';
    h+='<div class="vline'+(v.r?" refrain":"")+'" data-i="'+i+'"><button class="play" data-i="'+i+'" aria-label="Écouter">🔊</button><span class="txt">'+lineHTML(v.t,true)+'</span></div>';
  });
  h+='</div></div><div class="dico" id="dico"></div>';
  h+='<p class="note-audio">Touche les mots soulignés pour savoir ce qu\'ils veulent dire. (Voix de lecture : la vraie mélodie arrive bientôt.)</p>';
  h+='<div class="actions"><button class="go alt" id="all">▶ Tout écouter</button><button class="go" id="done">J\'ai lu ✔</button></div>';
  $("#stage").innerHTML=h;
  var running=false;
  function play(i, then){
    document.querySelectorAll(".vline").forEach(function(x){ x.classList.remove("playing"); });
    document.querySelectorAll(".w.lit").forEach(function(x){ x.classList.remove("lit"); });
    var row=document.querySelector('.vline[data-i="'+i+'"]'); row.classList.add("playing");
    row.scrollIntoView({block:"nearest", behavior:"smooth"});
    var words=[].slice.call(row.querySelectorAll(".w"));
    speak(VERS[i].t.replace("LIBERTÉ","Liberté"), function(ci){
      words.forEach(function(w){ w.classList.toggle("lit", +w.dataset.c<=ci && +w.dataset.c+w.textContent.length>ci); });
    }, function(){ row.classList.remove("playing"); words.forEach(function(w){ w.classList.remove("lit"); }); if(then) then(); });
  }
  document.querySelectorAll(".play").forEach(function(b){ b.onclick=function(){ running=false; play(+b.dataset.i); }; });
  document.querySelectorAll(".hard").forEach(function(s){
    s.onclick=function(){ var k=s.dataset.k, d=$("#dico"); d.innerHTML='<b>'+esc(k)+'</b> — '+esc(DICO[k]); d.classList.add("on"); speak(k+". "+DICO[k]); };
  });
  $("#all").onclick=function(){ running=true; var i=0; (function nx(){ if(!running||i>=VERS.length) return; play(i++, nx); })(); };
  $("#done").onclick=function(){ running=false; finish("Tu as lu toutes les paroles."); };
}

/* ── 3. Le mot manquant ── */
function actTrous(){
  var rounds=shuffle(TROUS).slice(0,8), k=0;
  function draw(){
    if(k>=rounds.length) return finish(errors<=1 ? "Sans presque aucune erreur !" : "Tu connais de mieux en mieux les mots.");
    var r=rounds[k], t=VERS[r.v].t;
    $("#actCnt").textContent=(k+1)+"/"+rounds.length;
    var before=VERS[r.v-1] ? '<div style="opacity:.45;font-size:.8em">'+esc(VERS[r.v-1].t)+'</div>' : "";
    var line=esc(t).replace(esc(r.ok),'<span class="blank">&nbsp;?&nbsp;</span>');
    var h='<p class="q">Quel est le bon mot ?</p><div class="card bigline">'+before+line+'</div><div class="choices">';
    shuffle([r.ok].concat(r.ko)).forEach(function(c){ h+='<button class="choice" data-c="'+esc(c)+'">'+esc(c)+'</button>'; });
    h+='</div><div class="hint" id="hint"></div>';
    $("#stage").innerHTML=h;
    var done=false;
    document.querySelectorAll(".choice").forEach(function(b){
      b.onclick=function(){
        if(done) return;
        if(b.dataset.c===r.ok){ done=true; b.classList.add("good"); sGood(); $(".blank").textContent=r.ok; speak(t.replace("LIBERTÉ","Liberté")); k++; setTimeout(draw,1700); }
        else { errors++; sBad(); wob(b); $("#hint").textContent="Pas tout à fait. Essaie encore !"; }
      };
    });
  }
  draw();
}

/* ── 4. Dans l'ordre ── */
function actOrdre(){
  var s=0;
  function strophe(){
    if(s>=STROPHES.length) return finish("Tu sais l'ordre de tous les vers.");
    var a=STROPHES[s][0], b=STROPHES[s][1], lines=[];
    for(var i=a;i<=b;i++) lines.push(VERS[i].t);
    var next=0, pool=shuffle(lines.map(function(t,i){ return {t:t,id:i}; }));
    $("#actCnt").textContent="Partie "+(s+1)+"/"+STROPHES.length;
    function draw(){
      var h='<p class="q">Touche les vers dans le bon ordre</p><div class="card answer" id="ans">';
      for(var i=0;i<next;i++) h+='<div class="placed">'+esc(lines[i])+'</div>';
      if(!next) h+='<div style="color:#9aa69f;font-weight:800;text-align:center">Quel est le premier vers&nbsp;?</div>';
      h+='</div><div class="pool">';
      pool.forEach(function(p){ h+='<button class="piece" data-id="'+p.id+'">'+esc(p.t)+'</button>'; });
      h+='</div><div class="hint" id="hint"></div>';
      $("#stage").innerHTML=h;
      document.querySelectorAll(".piece").forEach(function(btn){
        btn.onclick=function(){
          var p=pool.filter(function(x){ return x.id===+btn.dataset.id; })[0];
          if(p.t===lines[next]){ // vers identiques (refrain) : interchangeables
            sGood(); pool.splice(pool.indexOf(p),1); next++;
            if(next>=lines.length){ s++; speak("Bravo !"); setTimeout(strophe,900); draw(); }
            else draw();
          } else { errors++; sBad(); wob(btn); $("#hint").textContent="Ce n'est pas encore celui-là."; }
        };
      });
    }
    draw();
  }
  strophe();
}

/* ── 5. La chasse à l'erreur ── */
function actChasse(){
  var pool=ERREURS_COURANTES.map(function(e){ return {v:e.v, faux:e.faux, vrai:e.vrai}; });
  shuffle(TROUS).forEach(function(t){ if(pool.length<8) pool.push({v:t.v, faux:t.ko[Math.floor(Math.random()*t.ko.length)], vrai:t.ok}); });
  var rounds=pool.slice(0,8), k=0;
  function draw(){
    if(k>=rounds.length) return finish("Plus personne ne te trompera sur les mots !");
    var r=rounds[k], vrai=VERS[r.v].t, faux=vrai.replace(r.vrai, r.faux);
    $("#actCnt").textContent=(k+1)+"/"+rounds.length;
    var words=faux.split(" "), fw=r.faux.split(" ");
    var start=-1;
    var clean=function(x){ return x.replace(/[,.!?;:]/g,""); };
    for(var i=0;i<=words.length-fw.length;i++){ if(clean(words.slice(i,i+fw.length).join(" "))===clean(r.faux)){ start=i; break; } }
    var h='<p class="q">Un mot est faux. Touche-le !</p><div class="card bigline">';
    words.forEach(function(w,i){ h+='<button class="wbtn" data-i="'+i+'">'+esc(w)+'</button> '; });
    h+='</div><div class="hint" id="hint"></div>';
    $("#stage").innerHTML=h;
    var done=false;
    document.querySelectorAll(".wbtn").forEach(function(b){
      b.onclick=function(){
        if(done) return;
        var i=+b.dataset.i;
        if(i>=start && i<start+fw.length){
          done=true; sGood();
          $(".bigline").innerHTML=esc(vrai).replace(esc(r.vrai),'<span class="wbtn shown">'+esc(r.vrai)+'</span>');
          $("#hint").style.color="var(--green)"; $("#hint").textContent="On ne chante pas « "+r.faux+" » mais « "+r.vrai+" ».";
          speak("On chante : "+vrai.replace("LIBERTÉ","Liberté")); k++; setTimeout(draw,2600);
        } else { errors++; sBad(); wob(b); $("#hint").textContent="Ce mot-là est juste. Cherche encore !"; }
      };
    });
  }
  draw();
}

/* ── 6. Chanter seul (les mots s'effacent) ── */
function actChanter(){
  var RATIO=[0,.35,.7,1], pass=0, reveals=0;
  // mots « effaçables » : on garde visibles les petits mots (de, la, l'…) jusqu'au dernier passage
  var SMALL=/^(de|la|le|les|du|des|à|en|et|que|qui|au|nos|ses|tous|d'un|c'est|dans)$/i;
  var order=[]; VERS.forEach(function(v,i){ v.t.split(" ").forEach(function(w,j){ order.push({i:i,j:j,small:SMALL.test(w.replace(/[,.!]/g,""))}); }); });
  order=shuffle(order.filter(function(o){ return !o.small; })).concat(shuffle(order.filter(function(o){ return o.small; })));
  function hidden(){ var n=Math.round(order.length*RATIO[pass]), set={}; order.slice(0,n).forEach(function(o){ set[o.i+"-"+o.j]=1; }); return set; }
  function draw(){
    var set=hidden();
    $("#actCnt").textContent=(pass+1)+"/"+RATIO.length;
    var h='<div class="passes">'+RATIO.map(function(_,i){ return '<i class="'+(i<=pass?"on":"")+'"></i>'; }).join("")+'</div>';
    h+='<p class="q">'+(pass===0?"Chante l'hymne en lisant.":pass<3?"Des mots ont disparu. Chante quand même !":"Plus aucun mot. Chante de mémoire !")+'</p>';
    h+='<div class="card kara"><div class="lyrics">';
    VERS.forEach(function(v,i){
      if(i===10) h+='<div class="gap-line"></div>';
      h+='<div class="vline'+(v.r?" refrain":"")+'"><span class="txt">'+v.t.split(" ").map(function(w,j){
        return set[i+"-"+j] ? '<span class="hid">'+esc(w)+'</span>' : esc(w);
      }).join(" ")+'</span></div>';
    });
    h+='</div></div><p class="note-audio">Un trou de mémoire ? Touche le mot caché pour le voir.</p>';
    h+='<div class="actions"><button class="go" id="nx">'+(pass<RATIO.length-1?"J'ai chanté ! Passage suivant →":"J'ai chanté tout l'hymne ✔")+'</button></div>';
    $("#stage").innerHTML=h;
    document.querySelectorAll(".hid").forEach(function(s){ s.onclick=function(){ if(!s.classList.contains("rev")){ s.classList.add("rev"); reveals++; errors++; } }; });
    $("#nx").onclick=function(){ sGood(); if(pass<RATIO.length-1){ pass++; draw(); $("#stage").scrollTop=0; } else finish(reveals===0?"Tout l'hymne de mémoire, sans aide !":"Tu as chanté tout l'hymne. Recommence pour le faire sans aide !"); };
  }
  draw();
}
