<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>L'Imagier PATI</title>
<script src="./imagier-data.js"></script>
<style>
  :root{
    --green:#0D2B1A; --gold:#FFC93C; --accent:#C8841E; --cream:#FFF6E7;
    --ok:#1F6E52; --bad:#E0533D;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; background:var(--green); color:var(--green); overflow:hidden;}
  #app{height:100%; display:flex; flex-direction:column;}

  /* ===== Barre du haut ===== */
  .top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; background:var(--green); color:#fff; flex-shrink:0;}
  .top .theme{font-weight:bold; font-size:clamp(15px,4vw,20px); display:flex; align-items:center; gap:8px;}
  .top .right{display:flex; align-items:center; gap:14px;}
  .chrono{font-weight:bold; font-size:clamp(16px,4.5vw,22px); color:var(--gold); font-variant-numeric:tabular-nums;}
  .count{font-size:13px; opacity:.75; font-weight:bold;}
  .btn-quit{background:rgba(255,255,255,.12); border:0; color:#fff; font-weight:bold; border-radius:999px; padding:6px 14px; font-size:14px; cursor:pointer;}

  /* ===== Écrans ===== */
  .screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; background:var(--cream); overflow-y:auto;}
  .screen h1{font-size:clamp(24px,7vw,38px); color:var(--green);}
  .screen p{font-size:clamp(15px,4vw,18px); color:#5a6b62; font-weight:bold; max-width:480px;}
  .themes{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; width:100%; max-width:560px;}
  .theme-card{border:0; border-radius:22px; padding:22px 16px; color:#fff; font-weight:bold; font-size:clamp(15px,4vw,18px); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:10px; transition:transform .12s; box-shadow:0 6px 0 rgba(0,0,0,.12);}
  .theme-card:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.12);}
  .theme-card .em{font-size:42px;}

  /* ===== Choix du mode ===== */
  .modes{display:flex; flex-direction:column; gap:16px; width:100%; max-width:440px;}
  .mode-card{border:0; border-radius:24px; padding:24px; cursor:pointer; display:flex; align-items:center; gap:18px; text-align:left; transition:transform .12s; box-shadow:0 6px 0 rgba(0,0,0,.12);}
  .mode-card:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.12);}
  .mode-card .ic{font-size:40px; flex-shrink:0;}
  .mode-card .tt{font-weight:bold; font-size:20px; color:#fff; display:block;}
  .mode-card .ds{font-size:14px; color:rgba(255,255,255,.85); font-weight:bold;}

  /* ===== Plateau (mode DÉFI : grille) ===== */
  .board{flex:1; display:flex; flex-direction:column; background:var(--cream); padding:12px; gap:10px; overflow:hidden;}
  .zone-label{font-size:12px; font-weight:bold; color:#8a9389; text-transform:uppercase; letter-spacing:.05em; text-align:center;}
  .grid{display:grid; gap:10px; align-content:start;}
  .images{grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); flex:1; overflow-y:auto;}
  .words{grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); flex-shrink:0;}
  .img-card{aspect-ratio:1; border-radius:18px; background:#fff; border:3px solid #0d2b1a14; display:flex; align-items:center; justify-content:center; font-size:clamp(34px,11vw,54px); cursor:pointer; transition:transform .1s,border-color .15s,opacity .25s; user-select:none; overflow:hidden;}
  .img-card img{width:100%; height:100%; object-fit:contain; padding:8px;}
  .img-card:active{transform:scale(.95);}
  .img-card.sel{border-color:var(--accent); transform:scale(1.04); box-shadow:0 0 0 4px #C8841E33;}
  .img-card.done{opacity:0; pointer-events:none; transform:scale(.5);}
  .word-card{padding:14px 10px; border-radius:16px; background:var(--green); color:#fff; font-weight:bold; font-size:clamp(14px,4vw,18px); cursor:pointer; text-align:center; transition:transform .1s,background .15s,opacity .25s; user-select:none;}
  .word-card .sou{display:block; font-size:.72em; font-weight:normal; opacity:.7; margin-top:2px;}
  .word-card:active{transform:scale(.95);}
  .word-card.sel{background:var(--accent); transform:scale(1.04);}
  .word-card.done{opacity:0; pointer-events:none; transform:scale(.5);}
  .word-card.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .flash-ok{animation:flashok .5s;}
  @keyframes flashok{0%{background:var(--ok)!important}100%{}}

  /* ===== Plateau (mode SOLO : une image, des mots) ===== */
  .solo{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--cream); padding:20px; gap:24px;}
  .solo-img{width:min(60vw,260px); height:min(60vw,260px); border-radius:32px; background:#fff; border:4px solid #0d2b1a14; display:flex; align-items:center; justify-content:center; font-size:clamp(80px,28vw,150px); user-select:none; overflow:hidden; transition:transform .2s;}
  .solo-img img{width:100%; height:100%; object-fit:contain; padding:14px;}
  .solo-img.pop{animation:pop .4s;}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .solo-q{font-size:clamp(18px,5vw,24px); font-weight:bold; color:var(--green);}
  .solo-choices{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:480px;}
  .solo-choice{padding:20px 14px; border-radius:20px; background:var(--green); color:#fff; font-weight:bold; font-size:clamp(16px,4.5vw,20px); cursor:pointer; text-align:center; transition:transform .1s,background .2s; user-select:none;}
  .solo-choice .sou{display:block; font-size:.7em; font-weight:normal; opacity:.7; margin-top:3px;}
  .solo-choice:active{transform:scale(.96);}
  .solo-choice.good{background:var(--ok); animation:pop .4s;}
  .solo-choice.wrong{background:var(--bad); animation:shake .4s;}
  .solo-replay{display:inline-flex; align-items:center; gap:8px; background:none; border:0; color:var(--accent); font-weight:bold; font-size:15px; cursor:pointer; padding:6px;}

  /* ===== Victoire ===== */
  .win{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; background:var(--green); color:#fff;}
  .win .big{font-size:64px;}
  .win h2{font-size:clamp(24px,6vw,34px);}
  .win .time{font-size:clamp(30px,9vw,48px); font-weight:bold; color:var(--gold); font-variant-numeric:tabular-nums;}
  .win .msg{font-size:16px; opacity:.85; font-weight:bold; max-width:420px;}
  .win button{border:0; border-radius:999px; padding:14px 28px; font-weight:bold; font-size:17px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.18);}
  .win .again{background:var(--accent); color:#fff;}
  .win .home{background:var(--gold); color:var(--green);}

  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="app">

  <!-- ACCUEIL : choix du thème -->
  <section id="home" class="screen">
    <h1>🖼️ L'Imagier PATI</h1>
    <p>Choisis un thème.</p>
    <div id="themeList" class="themes"></div>
  </section>

  <!-- CHOIX DU MODE -->
  <section id="modeScreen" class="screen hidden">
    <h1 id="modeTitle"></h1>
    <p>Comment veux-tu jouer&nbsp;?</p>
    <div class="modes" id="modeNormal">
      <button class="mode-card" style="background:#1F6E52" onclick="startSolo()">
        <span class="ic">🔍</span>
        <span><span class="tt">Découvrir</span><span class="ds">Une image, tu trouves le mot. À ton rythme, sans chrono.</span></span>
      </button>
      <button class="mode-card" style="background:#C8841E" onclick="startDefi()">
        <span class="ic">⏱️</span>
        <span><span class="tt">Défi</span><span class="ds">Relie tous les mots aux images, le plus vite possible&nbsp;!</span></span>
      </button>
    </div>
    <div class="modes hidden" id="modeAlpha">
      <button class="mode-card" style="background:#1F6E52" onclick="startAlpha('letter')">
        <span class="ic">🔤</span>
        <span><span class="tt">Quelle lettre&nbsp;?</span><span class="ds">Une lettre apparaît, tu la reconnais parmi d'autres.</span></span>
      </button>
      <button class="mode-card" style="background:#C8841E" onclick="startAlpha('word')">
        <span class="ic">🍍</span>
        <span><span class="tt">Lettre &amp; image</span><span class="ds">Une image apparaît, tu trouves la lettre du début.</span></span>
      </button>
    </div>
    <div class="modes hidden" id="modeScript">
      <p id="scriptIntro" style="font-size:14px; color:#5a6b62; font-weight:bold; max-width:440px; margin-bottom:4px;"></p>
      <button class="mode-card" style="background:#1F6E52" onclick="startScript()">
        <span class="ic">✍️</span>
        <span><span class="tt">Découvrir les lettres</span><span class="ds">Une lettre apparaît, tu la reconnais. À ton rythme.</span></span>
      </button>
    </div>
    <button class="solo-replay" onclick="backHome()">← Changer de thème</button>
  </section>

  <!-- JEU DÉFI (grille) -->
  <div id="game" class="hidden" style="flex:1; display:flex; flex-direction:column;">
    <div class="top">
      <div class="theme"><span id="tEmoji"></span><span id="tTitle"></span></div>
      <div class="right">
        <span id="countLeft" class="count"></span>
        <span id="chrono" class="chrono">0:00</span>
        <button class="btn-quit" onclick="quit()">Quitter</button>
      </div>
    </div>
    <div class="board">
      <div class="zone-label">Les images</div>
      <div id="imagesGrid" class="grid images"></div>
      <div class="zone-label">Les mots — touche-en un</div>
      <div id="wordsGrid" class="grid words"></div>
    </div>
  </div>

  <!-- JEU SOLO (une image) -->
  <div id="soloGame" class="hidden" style="flex:1; display:flex; flex-direction:column;">
    <div class="top">
      <div class="theme"><span id="sEmoji"></span><span id="sTitle"></span></div>
      <div class="right">
        <button id="autoSpeakBtn" class="btn-quit" onclick="toggleAutoSpeak()" title="Dire le mot dès que l'image apparaît">🔇 Mot caché</button>
        <span id="soloCount" class="count"></span>
        <button class="btn-quit" onclick="quit()">Quitter</button>
      </div>
    </div>
    <div class="solo">
      <div class="solo-q">Qu'est-ce que c'est&nbsp;?</div>
      <div id="soloImg" class="solo-img"></div>
      <div id="soloChoices" class="solo-choices"></div>
      <button class="solo-replay" onclick="speakCurrent()">🔊 Entends le mot</button>
    </div>
  </div>

  <!-- VICTOIRE -->
  <section id="win" class="win hidden">
    <div class="big">🎉</div>
    <h2 id="winTitle">Bravo&nbsp;!</h2>
    <div id="winTime" class="time hidden">0:00</div>
    <p id="winMsg" class="msg"></p>
    <button class="again" onclick="replaySame()">↻ Recommencer</button>
    <button class="home" onclick="goHome()">⌂ Autre thème</button>
  </section>

</div>

<script>
(function(){
  const THEMES = window.IMAGIER_THEMES || [];
  let theme=null, mode=null;
  // défi
  let remaining=0, selWord=null, startTime=0, timerId=null;
  // solo
  let soloQueue=[], soloIdx=0, soloPair=null, soloLocked=false;
  let soloAutoSpeak=false; // la 1re lecture quand l'image paraît est-elle automatique ? (défaut : non — l'enfant regarde d'abord)

  const $ = s => document.querySelector(s);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]];} return a; };
  const isEmoji = s => s && !s.includes("/") && !s.includes(".");
  const fmt = ms => { const s=Math.floor(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
  const imgHTML = p => isEmoji(p.img) ? p.img : `<img src="${p.img}" alt="${p.fr}">`;

  function speak(pair){
    if(pair.audio){ try{ const a=new Audio(pair.audio); a.play().catch(()=>synth(pair.fr)); return; }catch(e){} }
    synth(pair.fr);
  }
  function synth(text){
    if(!("speechSynthesis" in window)) return;
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="fr-FR"; u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){}
  }

  // ---------- accueil ----------
  function buildHome(){
    const list=$("#themeList"); list.innerHTML="";
    THEMES.forEach(t=>{
      const b=document.createElement("button");
      b.className="theme-card"; b.style.background=t.couleur;
      b.innerHTML=`<span class="em">${t.emoji}</span>${t.titre}`;
      b.onclick=()=>chooseMode(t);
      list.appendChild(b);
    });
  }
  function show(id){ ["home","modeScreen","game","soloGame","win"].forEach(s=>$("#"+s).classList.toggle("hidden", s!==id)); }

  // ---------- choix du mode ----------
  function chooseMode(t){
    theme=t;
    $("#modeTitle").textContent=t.emoji+" "+t.titre;
    if(t.type==="alphabet"){
      // alphabet latin : 2 sous-modes
      $("#modeNormal").classList.add("hidden");
      $("#modeAlpha").classList.remove("hidden");
      $("#modeScript").classList.add("hidden");
    }else if(t.type==="alphabet-img"){
      // écriture africaine (images de lettres) : mode reconnaissance
      $("#modeNormal").classList.add("hidden");
      $("#modeAlpha").classList.add("hidden");
      $("#modeScript").classList.remove("hidden");
      $("#scriptIntro").textContent = t.intro || "";
    }else{
      $("#modeNormal").classList.remove("hidden");
      $("#modeAlpha").classList.add("hidden");
      $("#modeScript").classList.add("hidden");
    }
    show("modeScreen");
  }
  window.backHome = ()=> show("home");
  window.goHome = ()=> show("home");

  // =====================================================================
  // MODE SOLO — une image, choisir le bon mot, SANS CHRONO, sans pénalité
  // =====================================================================
  window.startSolo = ()=>{
    mode="solo";
    soloQueue = shuffle(theme.paires);
    soloIdx = 0;
    show("soloGame");
    $("#sEmoji").textContent=theme.emoji; $("#sTitle").textContent=theme.titre;
    $("#autoSpeakBtn").classList.remove("hidden");
    $("#autoSpeakBtn").textContent = soloAutoSpeak ? "🔊 Mot dit" : "🔇 Mot caché";
    nextSolo();
  };

  function nextSolo(){
    if(soloIdx >= soloQueue.length){ soloWin(); return; }
    soloLocked=false;
    soloPair = soloQueue[soloIdx];
    $(".solo-q").textContent="Qu'est-ce que c'est ?";
    $("#soloCount").textContent = (soloIdx+1)+" / "+soloQueue.length;
    // image
    const im=$("#soloImg"); im.style.fontSize=""; im.innerHTML=imgHTML(soloPair); im.classList.remove("pop"); void im.offsetWidth; im.classList.add("pop");
    // 3 choix : la bonne + 2 leurres du même thème
    const leurres = shuffle(theme.paires.filter(p=>p.fr!==soloPair.fr)).slice(0,2);
    const choices = shuffle([soloPair, ...leurres]);
    const box=$("#soloChoices"); box.innerHTML="";
    box.style.gridTemplateColumns = choices.length>2 ? "1fr 1fr" : "1fr";
    choices.forEach(p=>{
      const b=document.createElement("button");
      b.className="solo-choice";
      b.innerHTML = p.fr + (p.sou ? `<span class="sou">${p.sou}</span>` : "");
      b.onclick=()=>soloPick(b,p);
      box.appendChild(b);
    });
    // prononce le mot à trouver SEULEMENT si l'auto-lecture est activée
    // (par défaut non : l'enfant regarde l'image et reconnaît l'objet AVANT d'entendre le mot)
    if(soloAutoSpeak) setTimeout(()=>speak(soloPair), 350);
  }

  function soloPick(btn, pair){
    if(soloLocked) return;
    if(pair.fr===soloPair.fr){
      soloLocked=true;
      btn.classList.add("good");
      speak(soloPair);
      setTimeout(()=>{ soloIdx++; nextSolo(); }, 900);
    }else{
      // pas de pénalité : on signale doucement, l'enfant réessaie
      btn.classList.add("wrong");
      setTimeout(()=>btn.classList.remove("wrong"), 450);
    }
  }
  // =====================================================================
  // MODE ÉCRITURE AFRICAINE (N'Ko, Adlam, Koré Sèbèli) — images de lettres
  // Montre une lettre (image, ou son nom si l'image manque), choisir le bon nom.
  // Lettres en ordre ALÉATOIRE. Sans chrono, sans pénalité.
  // =====================================================================
  let scrQueue=[], scrIdx=0, scrItem=null, scrLocked=false;

  // une "image" de lettre : si img réelle dispo → <img>, sinon repli = le nom dans un cadre
  function letterImgHTML(it, big){
    if(it.img && !it.img.includes("undefined")){
      // on tente l'image ; si elle casse au chargement, on bascule sur le nom
      return `<img src="${it.img}" alt="${it.nom}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${it.nom}',style:'font-weight:bold;color:#0D2B1A;font-size:${big?'40px':'24px'}'}))">`;
    }
    return `<span style="font-weight:bold;color:#0D2B1A;font-size:${big?'40px':'24px'}">${it.nom}</span>`;
  }

  window.startScript = ()=>{
    mode="script";
    scrQueue = shuffle(theme.lettres);
    scrIdx = 0;
    show("soloGame");
    $("#sEmoji").textContent=theme.emoji; $("#sTitle").textContent=theme.titre;
    $("#autoSpeakBtn").classList.add("hidden");
    nextScript();
  };

  function nextScript(){
    if(scrIdx >= scrQueue.length){ scriptWin(); return; }
    scrLocked=false;
    scrItem = scrQueue[scrIdx];
    $("#soloCount").textContent = (scrIdx+1)+" / "+scrQueue.length;
    $(".solo-q").textContent="Quelle lettre est-ce ?";
    const im=$("#soloImg"); im.style.fontSize="";
    im.innerHTML = letterImgHTML(scrItem, true);
    im.classList.remove("pop"); void im.offsetWidth; im.classList.add("pop");

    // 3 choix = noms de lettres
    const leurres = shuffle(theme.lettres.filter(l=>l.nom!==scrItem.nom)).slice(0,2);
    const choices = shuffle([scrItem, ...leurres]);
    const box=$("#soloChoices"); box.innerHTML=""; box.style.gridTemplateColumns="1fr 1fr 1fr";
    choices.forEach(it=>{
      const b=document.createElement("button");
      b.className="solo-choice"; b.style.fontSize="clamp(16px,5vw,22px)";
      b.textContent=it.nom;
      b.onclick=()=>scriptPick(b,it);
      box.appendChild(b);
    });
    // dire le nom de la lettre après une pause
    setTimeout(()=>speakText(scrItem.nom), 350);
  }

  function scriptPick(btn, it){
    if(scrLocked) return;
    if(it.nom===scrItem.nom){
      scrLocked=true; btn.classList.add("good");
      speakText(scrItem.nom);
      setTimeout(()=>{ scrIdx++; nextScript(); }, 1000);
    }else{
      btn.classList.add("wrong"); setTimeout(()=>btn.classList.remove("wrong"),450);
    }
  }

  function scriptWin(){
    show("win");
    $("#winTitle").textContent="Bravo ! "+theme.titre+" 🎉";
    $("#winTime").classList.add("hidden");
    $("#winMsg").textContent="Tu découvres une écriture de Guinée ! Tu veux recommencer ou essayer un autre thème ?";
  }

  // =====================================================================
  // MODE ALPHABET LATIN — 2 variantes : 'letter' / 'word'
  // =====================================================================
  let alphaVariant=null, alphaQueue=[], alphaIdx=0, alphaItem=null, alphaLocked=false;

  window.startAlpha = (variant)=>{
    mode="alpha"; alphaVariant=variant;
    alphaQueue = shuffle(theme.lettres);   // ordre aléatoire des lettres
    alphaIdx = 0;
    show("soloGame");
    $("#sEmoji").textContent=theme.emoji; $("#sTitle").textContent=theme.titre;
    $("#autoSpeakBtn").classList.add("hidden"); // pas d'auto-speak en alphabet
    nextAlpha();
  };

  function letterLabel(it){ return it.maj; } // majuscule seule (la minuscule faisait répéter la lettre à la lecture)

  function nextAlpha(){
    if(alphaIdx >= alphaQueue.length){ alphaWinAlpha(); return; }
    alphaLocked=false;
    alphaItem = alphaQueue[alphaIdx];
    $("#soloCount").textContent = (alphaIdx+1)+" / "+alphaQueue.length;
    const im=$("#soloImg"); im.classList.remove("pop"); void im.offsetWidth; im.classList.add("pop");
    const q=$(".solo-q");

    if(alphaVariant==="word"){
      // montre l'IMAGE, l'enfant choisit la LETTRE du début
      q.textContent="Par quelle lettre ça commence ?";
      im.style.fontSize=""; im.innerHTML = imgHTML({img:alphaItem.img, fr:alphaItem.mot});
    }else{
      // montre la LETTRE (Aa), l'enfant la reconnaît
      q.textContent="Quelle lettre est-ce ?";
      im.style.fontSize="clamp(70px,24vw,130px)";
      im.innerHTML = `<span style="font-weight:bold;color:${theme.couleur}">${letterLabel(alphaItem)}</span>`;
    }

    // 3 choix de lettres (la bonne + 2 autres), en "Aa"
    const leurres = shuffle(theme.lettres.filter(l=>l.maj!==alphaItem.maj)).slice(0,2);
    const choices = shuffle([alphaItem, ...leurres]);
    const box=$("#soloChoices"); box.innerHTML=""; box.style.gridTemplateColumns="1fr 1fr 1fr";
    choices.forEach(it=>{
      const b=document.createElement("button");
      b.className="solo-choice"; b.style.fontSize="clamp(22px,7vw,30px)";
      b.textContent=letterLabel(it);
      b.onclick=()=>alphaPick(b,it);
      box.appendChild(b);
    });
  }

  function alphaPick(btn, it){
    if(alphaLocked) return;
    if(it.maj===alphaItem.maj){
      alphaLocked=true;
      btn.classList.add("good");
      // dire la lettre puis le mot-exemple : "A. A comme Ananas"
      speakText(alphaItem.maj + ". " + alphaItem.maj + " comme " + alphaItem.mot);
      setTimeout(()=>{ alphaIdx++; nextAlpha(); }, 1300);
    }else{
      btn.classList.add("wrong"); setTimeout(()=>btn.classList.remove("wrong"),450);
    }
  }

  function alphaWinAlpha(){
    show("win");
    $("#winTitle").textContent="Bravo ! "+theme.titre+" 🎉";
    $("#winTime").classList.add("hidden");
    $("#winMsg").textContent="Tu connais tes lettres ! Tu veux recommencer ou essayer un autre thème ?";
  }

  function speakText(text){
    if(!("speechSynthesis" in window)) return;
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="fr-FR"; u.rate=.8; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){}
  }

  window.speakCurrent = ()=>{
    if(mode==="script" && scrItem){ speakText(scrItem.nom); return; }
    if(mode==="alpha" && alphaItem){ speakText(alphaItem.maj + " comme " + alphaItem.mot); return; }
    if(soloPair) speak(soloPair);
  };
  window.toggleAutoSpeak = ()=>{
    soloAutoSpeak = !soloAutoSpeak;
    const b=$("#autoSpeakBtn");
    b.textContent = soloAutoSpeak ? "🔊 Mot dit" : "🔇 Mot caché";
    // si on vient de l'activer, on dit le mot courant tout de suite
    if(soloAutoSpeak && soloPair) speak(soloPair);
  };

  function soloWin(){
    show("win");
    $("#winTitle").textContent="Bravo ! "+theme.titre+" 🎉";
    $("#winTime").classList.add("hidden");
    $("#winMsg").textContent="Tu as trouvé toutes les images ! Tu veux recommencer ou essayer un autre thème ?";
  }

  // =====================================================================
  // MODE DÉFI — la grille mot↔image, contre la montre
  // =====================================================================
  window.startDefi = ()=>{
    mode="defi"; selWord=null; remaining=theme.paires.length;
    show("game");
    $("#tEmoji").textContent=theme.emoji; $("#tTitle").textContent=theme.titre;
    const imgs=shuffle(theme.paires), words=shuffle(theme.paires);
    const ig=$("#imagesGrid"), wg=$("#wordsGrid"); ig.innerHTML=""; wg.innerHTML="";
    imgs.forEach(p=>{ const c=document.createElement("div"); c.className="img-card"; c.innerHTML=imgHTML(p); c.onclick=()=>onImage(c,p); ig.appendChild(c); });
    words.forEach(p=>{ const c=document.createElement("div"); c.className="word-card"; c.innerHTML=p.fr+(p.sou?`<span class="sou">${p.sou}</span>`:""); c.onclick=()=>onWord(c,p); wg.appendChild(c); });
    updateCount();
    startTime=Date.now(); clearInterval(timerId);
    timerId=setInterval(()=>{ $("#chrono").textContent=fmt(Date.now()-startTime); },250);
  };
  function updateCount(){ $("#countLeft").textContent = remaining+" / "+theme.paires.length; }
  function onWord(card,pair){
    if(card.classList.contains("done")) return;
    document.querySelectorAll(".word-card.sel").forEach(c=>c.classList.remove("sel"));
    selWord={card,pair}; card.classList.add("sel"); speak(pair);
  }
  function onImage(card,pair){
    if(card.classList.contains("done")) return;
    if(!selWord){ card.classList.add("sel"); setTimeout(()=>card.classList.remove("sel"),200); return; }
    if(selWord.pair.fr===pair.fr){
      card.classList.add("flash-ok"); const wc=selWord.card;
      setTimeout(()=>{ card.classList.add("done"); wc.classList.add("done"); },150);
      selWord=null; remaining--; updateCount();
      if(remaining<=0) defiWin();
    }else{
      selWord.card.classList.add("shake"); setTimeout(()=>selWord.card.classList.remove("shake"),400);
    }
  }
  function defiWin(){
    clearInterval(timerId); const ms=Date.now()-startTime;
    show("win");
    $("#winTitle").textContent="Bravo ! "+theme.titre+" 🎉";
    $("#winTime").classList.remove("hidden"); $("#winTime").textContent=fmt(ms);
    $("#winMsg").textContent="Tu as relié toutes les paires !";
    try{ parent.postMessage({type:"pati-progress", kind:"imagier", theme:theme.id, seconds:Math.round(ms/1000)}, "*"); }catch(e){}
  }

  // ---------- commun ----------
  window.replaySame = ()=>{
    if(mode==="script") startScript();
    else if(mode==="alpha") startAlpha(alphaVariant);
    else if(mode==="solo") startSolo();
    else startDefi();
  };
  window.quit = ()=>{ clearInterval(timerId); show("home"); };

  // ---------- ouverture directe ?theme=<id> ----------
  function autoStart(){
    try{
      const id=new URLSearchParams(location.search).get("theme");
      if(id){ const t=THEMES.find(x=>x.id===id); if(t){ chooseMode(t); return; } }
    }catch(e){}
  }

  buildHome();
  autoStart();
})();
</script>
</body>
</html>
